# Publishes the website automatically.
# Every time files change on this branch, GitHub rebuilds the live site.
# It also switches GitHub Pages on by itself the first time it runs,
# so nobody has to go digging through the settings screens.

name: Publish website

on:
  push:
    branches: ["claude/website-build-p7e9uw"]   # publish whenever files change
  workflow_dispatch:                            # or start it by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the site files
        uses: actions/checkout@v4

      - name: Turn GitHub Pages on if it isn't already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Put it live
        id: deployment
        uses: actions/deploy-pages@v4
